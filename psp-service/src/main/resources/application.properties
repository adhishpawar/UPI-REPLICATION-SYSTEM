spring.application.name=psp-service

server.port=8082

# General debug
logging.level.root=INFO
logging.level.com.upi.pspservice=DEBUG

# Transaction logs
logging.level.org.springframework.transaction=DEBUG

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/pspdb
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update  
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


jwt.private-key-path=keys/private_key_pkcs8.pem
jwt.public-key-path=keys/public_key.pem

spring.flyway.baseline-on-migrate=true
#spring.flyway.clean-on-validation-error=true
spring.flyway.baseline-version=1
logging.level.org.hibernate.type.descriptor.sql=TRACE
# Origins allowed to call the auth API from a browser. The backend showcase
# signs in here directly, so its origin must be listed.
showcase.allowed-origins=http://localhost:8090,http://127.0.0.1:8090
