spring.application.name=bank-service
server.port=8084

# General debug
logging.level.root=INFO
logging.level.com.upi.bankservice=DEBUG

# Transaction logs
logging.level.org.springframework.transaction=DEBUG

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/bankdb
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Ledger-grain change: the old UNIQUE(tx_id) constraint made it impossible for
# one transaction to have both a debit and a credit posting. ddl-auto=update
# adds the new UNIQUE(tx_id, type) but never drops the old one, so it is
# removed explicitly on startup. See docs/project-context/known-gaps.md G-17.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
